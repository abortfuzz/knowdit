[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2024"
authors = [
    "Ziqiao Kong <mio@lazym.io>"
]
license = "GPL-2.0-only"
description = "Smart contract auditing framework."
homepage = "https://github.com/abortfuzz/knowdit"
repository = "https://github.com/abortfuzz/knowdit"
readme = "Readme.md"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
itertools = "0"
dotenvy = "0"
color-eyre = "0"
tracing = "0"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
llmy = { version = "0.17" }
thiserror = "2"
async-channel = "2"
url = "2"

sea-orm = {version = "2.0.0-rc", features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-mysql"]}
serde = { version = "1", features = ["derive"] }
serde_json = {version = "1"}
clap = {version = "4", features = ["env", "derive"] }
ropey = "1.6"
globset = "0.4"
glob = "0.3"
schemars = "1"
tree-sitter = "0.25"
tree-sitter-solidity = "1.2.13"

foundry-compilers = { version = "0.19", features = ["svm-solc"] }
foundry-compilers-artifacts = "0.19"
alloy-serde = "1"
toml = "0.8"
shellexpand = "3"
humantime = "2"

knowdit-kg-model = { version = "1.0.1", path = "./crates/knowdit-kg-model" }
knowdit-repo-model = { version = "1.0.1", path = "./crates/knowdit-repo-model" }
knowdit-kg = { version = "1.0.1", path = "./crates/knowdit-kg" }
knowdit-sol = { version = "1.0.1", path = "./crates/knowdit-sol" }
knowdit = {version = "1.0.1", path = "./crates/knowdit"}
knowdit-agents = { version = "1.0.1", path = "./crates/knowdit-agents" }
knowdit-audit = { version = "1.0.1", path = "./crates/knowdit-audit" }
knowdit-cg-static = { version = "1.0.1", path = "./crates/knowdit-cg-static" }
knowdit-project = { version = "1.0.1", path = "./crates/knowdit-project" }
