foundry-compilers-artifacts.workspace = true
toml.workspace = true

# Linux-only: tikv's jemalloc fork. We switch the global allocator
# because glibc malloc fragments badly under the fuzz/regen hot path
# (multi-MB CallGraph allocations getting freed but not returned to
# the OS), which drives RSS to OOM over long runs. jemalloc's
# purge_decay defaults keep the working set tight without
# noticeably slowing throughput.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"
